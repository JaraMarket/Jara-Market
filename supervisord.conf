[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/www/html/storage/logs/laravel.log
stderr_logfile=/var/www/html/storage/logs/laravel.err

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
autostart=true
autorestart=unexpected
startsecs=5
stdout_logfile=/var/www/html/storage/logs/queue.log
stderr_logfile=/var/www/html/storage/logs/queue.err

[program:scheduler]
command=/bin/bash -c "while true; do php /var/www/html/artisan schedule:run >> /var/www/html/storage/logs/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
startsecs=5

[program:kafka-order-consumer]
command=php artisan kafka:consume-orders
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/kafka-orders.log
stderr_logfile=/var/www/html/storage/logs/kafka-orders.err


[program:kafka-wallet-consumer]
command=php artisan kafka:consume-wallet
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/kafka-wallet.log
stderr_logfile=/var/www/html/storage/logs/kafka-wallet.err


[program:websockets]
command=php artisan websockets:serve --port=6001
directory=/var/www/html
autostart=true
autorestart=unexpected
startsecs=5
stdout_logfile=/var/www/html/storage/logs/websockets.log
stderr_logfile=/var/www/html/storage/logs/websockets.err
