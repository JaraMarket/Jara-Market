[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/www/html/storage/logs
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:apache]
command=apache2-foreground
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/www/html/storage/logs/apache.log
stderr_logfile=/var/www/html/storage/logs/apache.err

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
autostart=true
autorestart=unexpected
startsecs=5
stdout_logfile=/var/www/html/storage/logs/queue.log
stderr_logfile=/var/www/html/storage/logs/queue.err

[program:scheduler]
command=/bin/bash -c "while true; do php /var/www/html/artisan schedule:run >> /var/www/html/storage/logs/scheduler.log 2>&1; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stderr_logfile=/var/www/html/storage/logs/scheduler.err

[program:kafka-order-consumer]
command=php artisan kafka:consume-orders
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/kafka-orders.log
stderr_logfile=/var/www/html/storage/logs/kafka-orders.err

[program:kafka-wallet-consumer]
command=php artisan kafka:consume-wallet
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/kafka-wallet.log
stderr_logfile=/var/www/html/storage/logs/kafka-wallet.err


[program:reverb]
command=php artisan reverb:start
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/reverb.log
stderr_logfile=/var/www/html/storage/logs/reverb.err
